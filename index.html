<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Príncipe &amp; Centauro · Redes</title>
  <meta name="description"
    content="Todas las redes de Príncipe & Centauro en un solo lugar: Instagram, Facebook y sitio web." />
  <meta name="theme-color" content="#0a0a0b" />
  <meta property="og:title" content="Príncipe & Centauro" />
  <meta property="og:description" content="Todas nuestras redes en un solo lugar." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="img/LogoPyC.jpeg" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Outfit:wght@300;400;500&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <div class="bg-glow" aria-hidden="true"></div>
  <div class="bg-grain" aria-hidden="true"></div>

  <main class="wrap">
    <article class="card">
      <span class="card__corner card__corner--tl" aria-hidden="true"></span>
      <span class="card__corner card__corner--tr" aria-hidden="true"></span>
      <span class="card__corner card__corner--bl" aria-hidden="true"></span>
      <span class="card__corner card__corner--br" aria-hidden="true"></span>

      <p class="eyebrow">Ecosistema digital</p>
      <header class="hero">
        <div class="monogram">
          <div class="monogram__ring" aria-hidden="true"></div>
          <div class="monogram__logo" role="img" aria-label="Logo de Príncipe y Centauro"></div>
        </div>
        <h1 class="title">Príncipe <em>&amp;</em> Centauro</h1>
        <div class="ornament" aria-hidden="true"><span></span><i></i><span></span></div>
        <p class="subtitle">Gastronomía de lujo</p>
      </header>

      <nav class="links" aria-label="Redes sociales">
        <a id="link-instagram" class="link" href="https://www.instagram.com/principeycentauro/" target="_blank"
          rel="noopener">
          <span class="link__icon">
            <svg viewBox="0 0 24 24">
              <path d="M7 2h10a5 5 0 0 1 5 5v10a5 5 0 0 1-5 5H7a5 5 0 0 1-5-5V7a5 5 0 0 1 5-5z" />
              <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z" />
              <path d="M17.5 6.5h.01" />
            </svg>
          </span>
          <span class="link__body">
            <span class="link__label">Instagram</span>
            <span class="link__meta">@principeycentauro</span>
          </span>
          <span class="link__arrow" aria-hidden="true">→</span>
        </a>

        <a id="link-facebook" class="link" href="https://www.facebook.com/profile.php?id=61582883068868" target="_blank"
          rel="noopener">
          <span class="link__icon">
            <svg viewBox="0 0 24 24">
              <path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z" />
            </svg>
          </span>
          <span class="link__body">
            <span class="link__label">Facebook</span>
            <span class="link__meta">Príncipe &amp; Centauro</span>
          </span>
          <span class="link__arrow" aria-hidden="true">→</span>
        </a>

        <a id="link-web" class="link" href="https://principeycentauro.com" target="_blank" rel="noopener">
          <span class="link__icon">
            <svg viewBox="0 0 24 24">
              <path d="M12 2a10 10 0 1 0 0 20a10 10 0 1 0 0-20z" />
              <path d="M2 12h20" />
              <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z" />
            </svg>
          </span>
          <span class="link__body">
            <span class="link__label">Sitio web</span>
            <span class="link__meta">principeycentauro.com</span>
          </span>
          <span class="link__arrow" aria-hidden="true">→</span>
        </a>
      </nav>

      <button id="share-btn" class="share" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 12v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7" />
          <path d="M16 6l-4-4-4 4" />
          <path d="M12 2v13" />
        </svg>
        <span id="share-label">Compartir tarjeta</span>
      </button>
    </article>

    <footer class="footer">© <span id="year">2026</span> Príncipe &amp; Centauro</footer>
  </main>

  <script src="script.js"></script>
</body>

</html>
